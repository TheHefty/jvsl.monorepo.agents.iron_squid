# The checks every pull request must pass before it can reach main. Each job is a required status
# check on the branch protection; renaming one breaks that link silently, so change both together.
# Also callable from the deploy workflow, which reruns them all on the release before publishing.
#
# acceptance runs on release-please's pull request only (NFR-D5, NFR-D8): the release is where it
# gates. On any other pull request its job is skipped by its own condition, which GitHub counts as
# passing a required check; a filter on the trigger would report nothing and block every pull
# request instead (task release-pipeline).
name: ci

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: site

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24', cache: npm, cache-dependency-path: site/package-lock.json }
      - run: npm ci
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24', cache: npm, cache-dependency-path: site/package-lock.json }
      - run: npm ci
      - run: npm run lint

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24', cache: npm, cache-dependency-path: site/package-lock.json }
      - run: npm ci
      - run: npm test

  # The settings the release discipline rests on: squash merges only, titled by the PR, and the
  # protection on main with every required check. One changed by hand fails here.
  repo-settings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24', cache: npm, cache-dependency-path: site/package-lock.json }
      - run: npm ci
      - run: npx tsx scripts/repo-settings.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24', cache: npm, cache-dependency-path: site/package-lock.json }
      - run: npm ci
      # Verified game images, keyed by every catalogue's image lock: a warm build downloads none.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: site/.cache/game-images
          key: game-images-${{ hashFiles('site/src/catalogue/*/images.lock.json') }}
          restore-keys: game-images-
      - run: npm run build

  acceptance:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24', cache: npm, cache-dependency-path: site/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Verified game images, keyed by every catalogue's image lock: a warm build downloads none.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: site/.cache/game-images
          key: game-images-${{ hashFiles('site/src/catalogue/*/images.lock.json') }}
          restore-keys: game-images-
      # Both places the site is served from: the domain root, and the repository path on
      # github.io. A base path that is wrong for where the site lives shows only once published.
      - name: acceptance at /
        env: { BASE_PATH: / }
        run: npm run build && npm run bdd
      - name: acceptance at /jvsl.monorepo.agents.iron_squid/
        env: { BASE_PATH: /jvsl.monorepo.agents.iron_squid/ }
        run: rm -rf dist && npm run build && npm run bdd
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: acceptance-report, path: site/e2e/test-results, retention-days: 7 }
